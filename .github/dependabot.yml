version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # The OpenTelemetry packages are version-locked on each other; bumping them one PR at
      # a time fails restore with NU1605. Keep the family in a single PR.
      opentelemetry:
        patterns:
          - "OpenTelemetry"
          - "OpenTelemetry.*"
    ignore:
      # Microsoft.Extensions.* versions are framework-aligned via TFM-conditional
      # ItemGroups in Directory.Packages.props (net8 -> 8.x, net10 -> 10.x).
      # Block major bumps so Dependabot can't push 10.x onto the net8 target;
      # cross-major moves are managed by hand. Not sufficient on its own: Dependabot does not
      # evaluate the conditions, so it reads one version per ID (the highest, i.e. the net10 one)
      # and a 10.x patch does not look major to this rule at all. What keeps it off the net8 floor
      # is the layout: the net10 group is declared first, so the line it edits is that one, and its
      # versions come from $(MEVersion10). PackageVersionFloorTests guards the order, the property
      # and both majors.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # Moq 4.21 needs Castle.Core 5.2.1, where an NSubstitute substitute throws ArgumentNullException
      # on any default interface member (castleproject/Core#684). Lift this once Castle.Core 6.0 ships
      # and bump Moq with a Castle.Core 6.0 reference.
      - dependency-name: "Moq"
        versions: [">= 4.21.0"]
      # The analyzers ship in UiPath.Caching.Abstractions and must load in the .NET 8 SDK, whose
      # compiler is Roslyn 4.8; a newer Roslyn here makes them, and the code fixes, fail to load.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        versions: [">= 4.9.0"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        versions: [">= 4.9.0"]
      # Its releases after 3.11 are versioned with, and meant for, the newer Roslyn.
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
        versions: [">= 3.12.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
