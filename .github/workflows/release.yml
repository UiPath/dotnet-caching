name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-tag:
    runs-on: uipath-ubuntu-latest
    steps:
      - name: Enforce release tag naming policy
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|preview|rc)\.[0-9]+)?$'
          if [[ ! "${GITHUB_REF_NAME}" =~ $re ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not an allowed release tag. Use vX.Y.Z or vX.Y.Z-{alpha|preview|rc}.N"
            exit 1
          fi
          echo "Tag '${GITHUB_REF_NAME}' matches the release policy."

  release:
    needs: validate-tag
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore UiPath.Caching.slnx

      - name: Build
        run: dotnet build UiPath.Caching.slnx -c Release --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --solution UiPath.Caching.slnx -c Release --no-build

      - name: FOSSA analyze (upload)
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c  # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: FOSSA test (license + CVE gate)
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c  # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

      - name: Pack (validation only — not published or uploaded)
        run: dotnet pack UiPath.Caching.slnx -c Release --no-build -o packages /p:Version=${{ steps.version.outputs.value }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Gated by the protected `nuget` environment (manual approval). Both nuget.org publishing
  # and Azure Key Vault signing authenticate with OIDC (no long-lived secrets): nuget.org via
  # trusted publishing, Key Vault via a federated credential on the signing app.
  publish-nuget:
    needs: release
    runs-on: uipath-ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write  # OIDC tokens for nuget.org trusted publishing and Azure federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore UiPath.Caching.slnx

      - name: Build
        run: dotnet build UiPath.Caching.slnx -c Release --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: dotnet pack UiPath.Caching.slnx -c Release --no-build -o packages /p:Version=${{ steps.version.outputs.value }}

      - name: Azure login (OIDC)
        env:
          KV_URL: ${{ secrets.SIGNING_KEYVAULT_URL }}
          KV_CERT: ${{ secrets.SIGNING_KEYVAULT_CERTIFICATE }}
          KV_TENANT_ID: ${{ secrets.SIGNING_AZURE_TENANT_ID }}
          KV_CLIENT_ID: ${{ secrets.SIGNING_AZURE_CLIENT_ID }}
          KV_SUBSCRIPTION_ID: ${{ secrets.SIGNING_AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "${KV_URL}" ] || [ -z "${KV_CERT}" ] || [ -z "${KV_SUBSCRIPTION_ID}" ]; then
            echo "::error::Key Vault signing is not configured (SIGNING_KEYVAULT_URL / SIGNING_KEYVAULT_CERTIFICATE / SIGNING_AZURE_SUBSCRIPTION_ID); nuget.org requires the registered author signature."
            exit 1
          fi
          # Federated (OIDC) login to Azure -- no client secret leaves GitHub. The runner's
          # short-lived GitHub token is exchanged, through the app's federated credential,
          # for Azure tokens scoped to this environment.
          oidc=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          az login --service-principal --username "${KV_CLIENT_ID}" --tenant "${KV_TENANT_ID}" \
            --federated-token "${oidc}" >/dev/null
          az account set --subscription "${KV_SUBSCRIPTION_ID}"

      # GitHub-hosted pool egress IPs rotate weekly, so the vault firewall cannot allow-list
      # them. Allow this runner's IP for the job only, like the ADO toggle.vault.access template.
      - name: Open Key Vault firewall for this runner
        id: kv-open
        env:
          KV_URL: ${{ secrets.SIGNING_KEYVAULT_URL }}
          KV_CERT: ${{ secrets.SIGNING_KEYVAULT_CERTIFICATE }}
        run: |
          kv_name=$(echo "${KV_URL}" | sed -E 's#^https://([^.]+)\..*#\1#')
          kv_rg=$(az keyvault show --name "${kv_name}" --query resourceGroup -o tsv)
          echo "name=${kv_name}" >> "$GITHUB_OUTPUT"
          echo "rg=${kv_rg}" >> "$GITHUB_OUTPUT"
          # The rules this job adds, space separated; written on exit so the close step removes them even after a failure.
          added=""
          trap 'echo "added=${added}" >> "$GITHUB_OUTPUT"' EXIT
          allowed=" "
          allow() {
            allowed="${allowed}$1 "
            # A rule that existed before this job belongs to someone else: leave it in place on close.
            existing=$(az keyvault network-rule list --name "${kv_name}" --resource-group "${kv_rg}" \
              --query "ipRules[?value=='$1' || value=='$1/32'] | length(@)" -o tsv)
            if [ "${existing}" != "0" ]; then
              echo "IP $1 is already allowed on ${kv_name}; not adding a rule."
              return
            fi
            echo "Adding IP rule $1/32 to ${kv_name}"
            az keyvault network-rule add --name "${kv_name}" --resource-group "${kv_rg}" \
              --ip-address "$1/32" >/dev/null
            added="${added:+${added} }$1"
          }
          ip=""
          for provider in https://ipv4.icanhazip.com https://api.ipify.org https://api4.my-ip.io/ip; do
            ip=$(curl -sS --max-time 10 "${provider}" | tr -d '[:space:]') || true
            [[ "${ip}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && break
            ip=""
          done
          if [ -z "${ip}" ]; then
            echo "::error::Could not determine the runner's egress IP."
            exit 1
          fi
          allow "${ip}"
          # The rule takes a while to reach the data plane. The vault can also see this runner
          # under another address than the IP services report (traffic from inside Azure); its
          # firewall reply names that address, which is then allowed too.
          for try in $(seq 1 20); do
            if err=$(az keyvault certificate show --vault-name "${kv_name}" --name "${KV_CERT}" --query id -o tsv 2>&1 >/dev/null); then
              echo "${kv_name} is reachable."
              exit 0
            fi
            code=$(printf '%s' "${err}" | grep -oE '\([A-Za-z]+\)' | head -1 || true)
            client=$(printf '%s' "${err}" | grep -oE 'Client address: [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $3}' || true)
            echo "${kv_name} refused the request: ${code:-no error code}${client:+, client address ${client}}"
            if [ -n "${client}" ] && [[ "${allowed}" != *" ${client} "* ]]; then
              allow "${client}"
              continue
            fi
            wait=$(( 2 ** try )); [ "${wait}" -gt 60 ] && wait=60
            echo "${kv_name} not reachable yet; waiting ${wait}s (try ${try}/20)"
            sleep "${wait}"
          done
          echo "::error::${kv_name} did not become reachable after the IP rule was added; last error: ${code:-none}${client:+, client address ${client}}."
          exit 1

      - name: Sign packages (author signature via Azure Key Vault)
        env:
          KV_URL: ${{ secrets.SIGNING_KEYVAULT_URL }}
          KV_CERT: ${{ secrets.SIGNING_KEYVAULT_CERTIFICATE }}
          KV_TENANT_ID: ${{ secrets.SIGNING_AZURE_TENANT_ID }}
        run: |
          kv_token=$(az account get-access-token --tenant "${KV_TENANT_ID}" --resource https://vault.azure.net --query accessToken -o tsv)
          dotnet tool install --global NuGetKeyVaultSignTool
          export PATH="${PATH}:${HOME}/.dotnet/tools"
          # RFC 3161 timestamping: the TSA reply is a signed token, so its integrity
          # does not depend on the transport. http is DigiCert's documented endpoint
          # (no https RFC 3161 endpoint is published) and carries only the hash.
          for pkg in packages/*.nupkg; do
            NuGetKeyVaultSignTool sign "${pkg}" \
              --file-digest sha256 \
              --timestamp-rfc3161 http://timestamp.digicert.com \
              --timestamp-digest sha256 \
              --azure-key-vault-url "${KV_URL}" \
              --azure-key-vault-certificate "${KV_CERT}" \
              --azure-key-vault-accesstoken "${kv_token}"
          done

      - name: Close Key Vault firewall for this runner
        if: always() && steps.kv-open.outputs.added != ''
        env:
          KV_NAME: ${{ steps.kv-open.outputs.name }}
          KV_RG: ${{ steps.kv-open.outputs.rg }}
          KV_IPS: ${{ steps.kv-open.outputs.added }}
        run: |
          failed=0
          for ip in ${KV_IPS}; do
            removed=0
            for try in 1 2 3; do
              if az keyvault network-rule remove --name "${KV_NAME}" --resource-group "${KV_RG}"                 --ip-address "${ip}/32" >/dev/null; then
                echo "Removed IP rule ${ip}/32 from ${KV_NAME}"
                removed=1
                break
              fi
              sleep 5
            done
            if [ "${removed}" = 0 ]; then
              echo "::error::Could not remove IP rule ${ip}/32 from ${KV_NAME}; remove it by hand."
              failed=1
            fi
          done
          exit "${failed}"

      - name: Authenticate to nuget.org (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

  # Internal alpha builds -> UiPath Azure DevOps Artifacts feed (mirrors ServiceCommon).
  # Only -alpha tags, gated by the PUBLISH_INTERNAL repo variable.
  publish-internal:
    needs: release
    runs-on: uipath-ubuntu-latest
    if: vars.PUBLISH_INTERNAL == 'true' && contains(github.ref_name, '-alpha')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore UiPath.Caching.slnx

      - name: Build
        run: dotnet build UiPath.Caching.slnx -c Release --no-restore /p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: dotnet pack UiPath.Caching.slnx -c Release --no-build -o packages /p:Version=${{ steps.version.outputs.value }}

      - name: Add internal feed source
        run: dotnet nuget add source "$FEED_URL" --name internal
        env:
          FEED_URL: ${{ secrets.AZDO_FEED_URL }}

      - name: Push to internal feed
        run: dotnet nuget push 'packages/*.nupkg' --source internal --api-key az --skip-duplicate
        env:
          NuGetPackageSourceCredentials_internal: Username=az;Password=${{ secrets.AZDO_ARTIFACTS_PAT }}
