name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:  # run on a stacked branch whose PR does not target main
  schedule:
    - cron: '0 3 * * *'  # the fault tests, nightly

jobs:
  # The oldest supported server: no ENTRIESREAD or max-deleted-entry-id, so the stream code takes its fallbacks.
  test-redis-6:
    if: github.event_name != 'schedule'
    runs-on: uipath-ubuntu-latest
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/UiPath.Caching.Tests -c Release -f net10.0

      - name: Build plugin contract tests
        run: dotnet build tests/UiPath.Caching.PluginContract.Tests -c Release -f net10.0

      - name: Test
        timeout-minutes: 20
        env:
          RUN_REDIS_INTEGRATION_TESTS: '1'
          REDIS_CONNECTION_STRING: 'localhost:6379'
        run: ./tests/UiPath.Caching.Tests/bin/Release/net10.0/UiPath.Caching.Tests

      - name: Plugin contract tests
        timeout-minutes: 20
        env:
          RUN_REDIS_INTEGRATION_TESTS: '1'
          REDIS_CONNECTION_STRING: 'localhost:6379'
        run: ./tests/UiPath.Caching.PluginContract.Tests/bin/Release/net10.0/UiPath.Caching.PluginContract.Tests

  # Slot-sensitive tests need a real cluster: three masters, each with a replica, as eng/keymove-kit.sh starts it.
  test-redis-cluster:
    if: github.event_name != 'schedule'
    runs-on: uipath-ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Start Redis cluster and a primary with a replica
        run: |
          set -o pipefail
          eng/keymove-kit.sh up cluster --base 7000 | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"
          eng/keymove-kit.sh up replica --base 7010 | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"

      - name: Build
        run: |
          dotnet build tests/UiPath.Caching.Tests -c Release -f net10.0
          dotnet build tests/UiPath.Caching.Migration.Tests -c Release -f net10.0

      # The classes that hold a cluster test; their single-server tests run against the primary of the kit.
      - name: Cluster tests
        timeout-minutes: 20
        env:
          RUN_REDIS_INTEGRATION_TESTS: '1'
        run: |
          core=""
          for c in KeyMove.MoveScriptsClusterTests KeyMove.KeyedPartialClusterTests KeyMove.GenerationClusterTests KeyMove.GroupDataOpsClusterTests \
                   KeyMove.StateClusterTests KeyMove.StateBarrierProofTests KeyMove.ClaimStoreTests KeyMove.ClearSweepTests KeyMove.KeyMoveSweepTests \
                   KeyMove.MovePlacementTests KeyMove.PreflightTests KeyMove.RegisteredKeySpaceDataTests KeyMove.StageCommandsTests \
                   KeyMove.StateReviewFixesTests Redis.RedisConnectorSelectProbeTests; do
            core="$core -class UiPath.Caching.Tests.$c"
          done
          # shellcheck disable=SC2086 # one argument per word
          ./tests/UiPath.Caching.Tests/bin/Release/net10.0/UiPath.Caching.Tests $core
          ./tests/UiPath.Caching.Migration.Tests/bin/Release/net10.0/UiPath.Caching.Migration.Tests \
            -class UiPath.Caching.Migration.Tests.KeyMove.KeyMoveHashClusterTests -class UiPath.Caching.Migration.Tests.KeyMove.MoverLeaseTests \
            -class UiPath.Caching.Migration.Tests.KeyMove.KeyMoveBatchClusterTests

      - name: Stop Redis cluster and replica kit
        if: always()
        run: |
          eng/keymove-kit.sh down --base 7000
          eng/keymove-kit.sh down --base 7010

  # The fault tests (failover, restart, pause) run on main and nightly only: a failure there goes to the flaky list and blocks no pull request.
  test-chaos:
    if: github.event_name != 'pull_request'
    runs-on: uipath-ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Start Redis cluster and a primary with a replica
        run: |
          set -o pipefail
          eng/keymove-kit.sh up cluster --base 7000 | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"
          eng/keymove-kit.sh up replica --base 7010 | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build tests/UiPath.Caching.Migration.Tests -c Release -f net10.0

      - name: Fault tests
        timeout-minutes: 20
        env:
          RUN_REDIS_INTEGRATION_TESTS: '1'
        run: ./tests/UiPath.Caching.Migration.Tests/bin/Release/net10.0/UiPath.Caching.Migration.Tests -trait "Category=Chaos"

      - name: Stop Redis cluster and replica kit
        if: always()
        run: |
          eng/keymove-kit.sh down --base 7000
          eng/keymove-kit.sh down --base 7010

  build-linux:
    if: github.event_name != 'schedule'
    runs-on: uipath-ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # SonarQube Cloud needs full history for new-code / blame

      - name: Setup Java (SonarScanner runtime)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarQube Cloud begin
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"UiPath_dotnet-caching"
          /o:"ui"
          /d:sonar.token="${{ env.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/**/*.xml"
          /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          /d:sonar.coverage.exclusions="eng/**,benchmarks/**,**/*.ps1"
          /d:sonar.cpd.exclusions="src/UiPath.Caching.Abstractions/ICache.cs,src/UiPath.Caching.Abstractions/ICacheOfT.cs,src/UiPath.Caching.Abstractions/IHashCache.cs,src/UiPath.Caching.Abstractions/IHashCacheOfT.cs"

      # The key move tests need more servers than the service: a replica of it, two independent servers for an
      # instance move, and a master with its own replica. The replicas allow DEBUG, since the tests stall them.
      - name: Start the extra Redis servers
        run: |
          docker run -d --name redis-replica --network host redis:7 redis-server --port 6380 --replicaof 127.0.0.1 6379 --enable-debug-command yes --appendonly no
          docker run -d --name redis-src --network host redis:7 redis-server --port 6381 --appendonly no
          docker run -d --name redis-dst --network host redis:7 redis-server --port 6382 --appendonly no
          docker run -d --name redis-sides --network host redis:7 redis-server --port 6383 --appendonly no
          docker run -d --name redis-sides-replica --network host redis:7 redis-server --port 6384 --replicaof 127.0.0.1 6383 --enable-debug-command yes --appendonly no
          for port in 6380 6381 6382 6383 6384; do
            until docker exec redis-src redis-cli -p "$port" ping | grep -q PONG; do sleep 1; done
          done
          for port in 6380 6384; do
            until docker exec redis-src redis-cli -p "$port" info replication | grep -q 'master_link_status:up'; do sleep 1; done
          done

      - name: Restore
        run: dotnet restore UiPath.Caching.slnx

      - name: Build
        run: dotnet build UiPath.Caching.slnx -c Release --no-restore

      - name: Test
        timeout-minutes: 20
        env:
          RUN_REDIS_INTEGRATION_TESTS: '1'
          REDIS_CONNECTION_STRING: 'localhost:6379'
          REDIS_REPLICA_CONNECTION_STRING: 'localhost:6380'
          CLAIM_REPLICA_CONNECTION_STRING: 'localhost:6380'
          TWO_SERVER_SRC: 'localhost:6381'
          TWO_SERVER_DST: 'localhost:6382'
          MOVE_SIDES_MASTER: 'localhost:6383'
          MOVE_SIDES_REPLICA: 'localhost:6384'
        run: dotnet test --solution UiPath.Caching.slnx -c Release --no-build -- --results-directory TestResults --report-xunit-trx --coverage --coverage-output-format xml

      - name: SonarQube Cloud end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-results-ubuntu-latest
          path: TestResults

      - name: Pack
        run: dotnet pack UiPath.Caching.slnx -c Release --no-build -o packages

  build-windows:
    if: github.event_name != 'schedule'
    runs-on: uipath-windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UiPath.Caching.slnx

      # -warnaserror is what keeps the analyzer rules in .editorconfig from drifting back:
      # TreatWarningsAsErrors stays false so a local build still compiles while you work. It rides
      # on this job alone. build-linux builds under the SonarScanner, whose analyzer package is not
      # pinned here, so a new Sonar rule would fail the build instead of reporting; the analyzers
      # this repo does pin run identically on both jobs, so gating one catches the same drift.
      - name: Build
        run: dotnet build UiPath.Caching.slnx -c Release --no-restore -warnaserror

      # Redis-backed integration tests run on the Linux job (service containers are Linux-only),
      # so here they skip and the rest of the suite runs.
      - name: Test
        timeout-minutes: 20
        run: dotnet test --solution UiPath.Caching.slnx -c Release --no-build -- --results-directory TestResults --report-xunit-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-results-windows-latest
          path: TestResults

  # FOSSA runs as its own parallel job (on push only) so it doesn't delay the build.
  fossa:
    if: github.event_name == 'push'
    runs-on: uipath-ubuntu-latest
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UiPath.Caching.slnx

      - name: FOSSA analyze (upload)
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c  # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: FOSSA test (license + CVE gate)
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c  # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
